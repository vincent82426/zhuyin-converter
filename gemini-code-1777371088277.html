<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘記切輸入法？注音還原工具</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4285F4;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #3367D6;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f0fe;
            border-left: 5px solid #4285F4;
            border-radius: 5px;
            font-size: 18px;
            color: #333;
            min-height: 24px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🇹🇼 注音亂碼還原工具</h1>
    <p>輸入忘記切換輸入法打出的英文（例如：su3cl3）</p>
    
    <textarea id="inputText" placeholder="請在此貼上亂碼..."></textarea>
    <button onclick="convertToZhuyin()">還原成注音</button>
    
    <div class="result-box" id="outputText">這裡會顯示結果</div>
</div>

<script>
    // 大千式鍵盤英數對應注音的字典
    const zhuyinMap = {
        '1': 'ㄅ', 'q': 'ㄆ', 'a': 'ㄇ', 'z': 'ㄈ',
        '2': 'ㄉ', 'w': 'ㄊ', 's': 'ㄋ', 'x': 'ㄌ',
        '3': 'ˇ', 'e': 'ㄍ', 'd': 'ㄎ', 'c': 'ㄏ',
        '4': 'ˋ', 'r': 'ㄐ', 'f': 'ㄑ', 'v': 'ㄒ',
        '5': 'ㄓ', 't': 'ㄔ', 'g': 'ㄕ', 'b': 'ㄖ',
        '6': 'ˊ', 'y': 'ㄗ', 'h': 'ㄘ', 'n': 'ㄙ',
        '7': '˙', 'u': 'ㄧ', 'j': 'ㄨ', 'm': 'ㄩ',
        '8': 'ㄚ', 'i': 'ㄛ', 'k': 'ㄜ', ',': 'ㄝ',
        '9': 'ㄞ', 'o': 'ㄟ', 'l': 'ㄠ', '.': 'ㄡ',
        '0': 'ㄢ', 'p': 'ㄣ', ';': 'ㄤ', '/': 'ㄥ',
        '-': 'ㄦ', ' ': ' ' 
    };

    function convertToZhuyin() {
        // 取得使用者輸入的文字，並轉成小寫（因為一般打字不會按Shift）
        const input = document.getElementById('inputText').value.toLowerCase();
        let result = '';

        // 逐字元進行轉換
        for (let i = 0; i < input.length; i++) {
            const char = input[i];
            // 如果在字典裡找得到，就轉換成注音；找不到（例如標點符號）就保留原樣
            if (zhuyinMap[char]) {
                result += zhuyinMap[char];
            } else {
                result += char;
            }
        }

        // 顯示結果
        document.getElementById('outputText').innerText = result || '這裡會顯示結果';
    }
</script>

</body>
</html>
