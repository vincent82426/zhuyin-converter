<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注音/亂碼雙向轉換工具</title>
    
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.2/dist/index.js"></script>

    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { font-size: 24px; color: #333; text-align: center; }
        h2 { font-size: 18px; color: #555; border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: 30px; }
        textarea { width: 100%; height: 80px; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; resize: none; box-sizing: border-box; }
        button { width: 100%; padding: 10px; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; transition: 0.3s; margin-bottom: 10px; font-weight: bold;}
        .btn-to-zh { background-color: #4285F4; }
        .btn-to-zh:hover { background-color: #3367D6; }
        .btn-to-en { background-color: #EA4335; }
        .btn-to-en:hover { background-color: #C5221F; }
        .result-box { padding: 15px; border-radius: 5px; font-size: 18px; color: #333; min-height: 24px; margin-bottom: 10px; word-wrap: break-word; white-space: pre-wrap; /* 確保空白鍵能正常顯示 */ }
        .box-zh { background-color: #e8f0fe; border-left: 5px solid #4285F4; }
        .box-en { background-color: #fce8e6; border-left: 5px solid #EA4335; }
        .note { font-size: 13px; color: #666; background-color: #fff3cd; padding: 10px; border-radius: 5px; border-left: 3px solid #ffc107; line-height: 1.5;}
    </style>
</head>
<body>

<div class="container">
    <h1>🇹🇼 鍵盤密碼雙向轉換器</h1>
    
    <h2>1. 忘記切輸入法？ (英文 ➔ 注音)</h2>
    <textarea id="inputEn" placeholder="輸入英文亂碼 (例：su3cl3)"></textarea>
    <button class="btn-to-zh" onclick="toZhuyin()">還原成注音！</button>
    <div class="result-box box-zh" id="outputZh">...</div>
    
    <h2>2. 想打火星文？ (中文 ➔ 英文)</h2>
    <textarea id="inputZh" placeholder="輸入一段中文 (例：我騎自行車去銀行)"></textarea>
    <button class="btn-to-en" onclick="toEnglish()">產生鍵盤密碼！</button>
    <div class="result-box box-en" id="outputEn">...</div>
    <p class="note">🚀 狀態：已修復一聲(空白鍵)邏輯，字與字無縫接軌！</p>
</div>

<script>
    // ================= 功能一：英文轉注音 =================
    const zhuyinMap = {
        '1':'ㄅ', 'q':'ㄆ', 'a':'ㄇ', 'z':'ㄈ', '2':'ㄉ', 'w':'ㄊ', 's':'ㄋ', 'x':'ㄌ',
        '3':'ˇ', 'e':'ㄍ', 'd':'ㄎ', 'c':'ㄏ', '4':'ˋ', 'r':'ㄐ', 'f':'ㄑ', 'v':'ㄒ',
        '5':'ㄓ', 't':'ㄔ', 'g':'ㄕ', 'b':'ㄖ', '6':'ˊ', 'y':'ㄗ', 'h':'ㄘ', 'n':'ㄙ',
        '7':'˙', 'u':'ㄧ', 'j':'ㄨ', 'm':'ㄩ', '8':'ㄚ', 'i':'ㄛ', 'k':'ㄜ', ',':'ㄝ',
        '9':'ㄞ', 'o':'ㄟ', 'l':'ㄠ', '.':'ㄡ', '0':'ㄢ', 'p':'ㄣ', ';':'ㄤ', '/':'ㄥ',
        '-':'ㄦ', ' ':' ' 
    };

    function toZhuyin() {
        const input = document.getElementById('inputEn').value.toLowerCase();
        let zhuyinStr = '';
        for (let char of input) {
            zhuyinStr += zhuyinMap[char] || char; 
        }
        document.getElementById('outputZh').innerText = zhuyinStr || '...';
    }


    // ================= 功能二：中文轉英文 (火星文) =================
    function toEnglish() {
        const input = document.getElementById('inputZh').value;
        if (!input) return;

        const { pinyin } = pinyinPro;
        
        // 呼叫套件，將中文轉成「帶數字音調」的拼音陣列 (例如：['wo3', 'qi2', 'zi4', 'xing2', 'che1'])
        const pinyinArray = pinyin(input, { type: 'array', toneType: 'num', nonZh: 'consecutive' });
        
        let englishStr = '';
        for (let pyStr of pinyinArray) {
            englishStr += pinyinToKeyboard(pyStr);
        }

        document.getElementById('outputEn').innerText = englishStr || '...';
    }

    // 🔥 核心引擎：羅馬拼音 ➔ 大千式鍵盤代碼轉換器
    function pinyinToKeyboard(pinyinStr) {
        // 【重要修改】嚴格捕捉「字母+數字音調」，確保不會誤配對到英文單字或標點符號
        let match = pinyinStr.match(/^([a-zü]+)(\d)$/i);
        if (!match) return pinyinStr; // 標點符號、英文或空格，直接原樣保留

        let py = match[1].toLowerCase().replace(/ü/g, 'v');
        let tone = match[2];

        // 【重要修改】將 1 聲對應到空白鍵 (' ')
        const toneMap = { '1': ' ', '2': '6', '3': '3', '4': '4', '5': '7', '0': '7' };
        let kbTone = toneMap[tone] || '';

        // 處理拼音特例 (j, q, x 後面接 u 其實是 ü 的音)
        if (py.match(/^[jqx]u/)) py = py.replace('u', 'v');

        // 處理 y, w 開頭的省略寫法
        if (py === 'yi') py = 'i';
        else if (py === 'yin') py = 'in';
        else if (py === 'ying') py = 'ing';
        else if (py.startsWith('yu')) py = py.replace('yu', 'v');
        else if (py.startsWith('y')) py = py.replace('y', 'i');

        if (py === 'wu') py = 'u';
        else if (py === 'weng') py = 'ueng';
        else if (py.startsWith('w')) py = py.replace('w', 'u');

        // 處理拼音省略的韻母
        if (py.match(/un$/)) py = py.replace(/un$/, 'uen');
        py = py.replace(/ui$/, 'uei').replace(/iu$/, 'iou');

        // 拆解聲母與韻母
        let initial = '';
        let final = py;
        const initials = ['zh', 'ch', 'sh', 'b', 'p', 'm', 'f', 'd', 't', 'n', 'l', 'g', 'k', 'h', 'j', 'q', 'x', 'r', 'z', 'c', 's'];
        for (let i of initials) {
            if (py.startsWith(i)) {
                initial = i;
                final = py.substring(i.length);
                break;
            }
        }

        // ㄓㄔㄕㄖㄗㄘㄙ 單獨存在時
        if (['zh', 'ch', 'sh', 'r', 'z', 'c', 's'].includes(initial) && final === 'i') final = '';

        // 最終鍵盤按鍵對應
        const iMap = {
            'b':'1', 'p':'q', 'm':'a', 'f':'z', 'd':'2', 't':'w', 'n':'s', 'l':'x',
            'g':'e', 'k':'d', 'h':'c', 'j':'r', 'q':'f', 'x':'v',
            'zh':'5', 'ch':'t', 'sh':'g', 'r':'b', 'z':'y', 'c':'h', 's':'n'
        };

        const fMap = {
            'a':'8', 'o':'i', 'e':'k', 'ea':'k', 'ai':'9', 'ei':'o', 'ao':'l', 'ou':'.',
            'an':'0', 'en':'p', 'ang':';', 'eng':'/', 'er':'-',
            'i':'u', 'ia':'u8', 'ie':'u,', 'iao':'ul', 'iou':'u.', 'ian':'u0', 'in':'up', 'iang':'u;', 'ing':'u/', 
            'u':'j', 'ua':'j8', 'uo':'ji', 'uai':'j9', 'uei':'jo', 'uan':'j0', 'uen':'jp', 'uang':'j;', 'ueng':'j/', 'ong':'j/',
            'v':'m', 've':'m,', 'ue':'m,', 'van':'m0', 'vn':'mp', 'iong':'m/'
        };

        let kbInitial = initial ? iMap[initial] : '';
        let kbFinal = final ? (fMap[final] || final) : '';

        // 組合：聲母 + 韻母 + 音調(包含一聲的空白)
        return kbInitial + kbFinal + kbTone;
    }
</script>

</body>
</html>
