<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注音亂碼雙向轉換工具</title>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { font-size: 24px; color: #333; text-align: center; }
        h2 { font-size: 18px; color: #555; border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: 30px; }
        textarea { width: 100%; height: 80px; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; resize: none; box-sizing: border-box; }
        button { width: 100%; padding: 10px; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; transition: 0.3s; margin-bottom: 10px; font-weight: bold;}
        .btn-to-zh { background-color: #4285F4; }
        .btn-to-zh:hover { background-color: #3367D6; }
        .btn-to-en { background-color: #EA4335; }
        .btn-to-en:hover { background-color: #C5221F; }
        .result-box { padding: 15px; border-radius: 5px; font-size: 18px; color: #333; min-height: 24px; margin-bottom: 10px; word-wrap: break-word;}
        .box-zh { background-color: #e8f0fe; border-left: 5px solid #4285F4; }
        .box-en { background-color: #fce8e6; border-left: 5px solid #EA4335; }
        .note { font-size: 13px; color: #666; background-color: #fff3cd; padding: 10px; border-radius: 5px; border-left: 3px solid #ffc107;}
    </style>
</head>
<body>

<div class="container">
    <h1>🇹🇼 鍵盤密碼雙向轉換器</h1>
    
    <h2>1. 忘記切中文？ (英文 ➔ 中文)</h2>
    <textarea id="inputEn" placeholder="輸入英文亂碼 (例：su3cl3)"></textarea>
    <button class="btn-to-zh" onclick="toChinese()">轉換成中文！</button>
    <div class="result-box box-zh" id="outputZh">...</div>
    
    <h2>2. 想打火星文？ (中文 ➔ 英文)</h2>
    <textarea id="inputZh" placeholder="輸入中文 (例：你好)"></textarea>
    <button class="btn-to-en" onclick="toEnglish()">產生鍵盤密碼！</button>
    <div class="result-box box-en" id="outputEn">...</div>

    <p class="note">💡 提示：如果「中轉英」沒有成功變成英文字母，是因為該中文字還沒加進程式碼的「迷你詞庫」中喔！</p>
</div>

<script>
    // 1. 鍵盤對應表 (英文 -> 注音)
    const zhuyinMap = {
        '1':'ㄅ', 'q':'ㄆ', 'a':'ㄇ', 'z':'ㄈ', '2':'ㄉ', 'w':'ㄊ', 's':'ㄋ', 'x':'ㄌ',
        '3':'ˇ', 'e':'ㄍ', 'd':'ㄎ', 'c':'ㄏ', '4':'ˋ', 'r':'ㄐ', 'f':'ㄑ', 'v':'ㄒ',
        '5':'ㄓ', 't':'ㄔ', 'g':'ㄕ', 'b':'ㄖ', '6':'ˊ', 'y':'ㄗ', 'h':'ㄘ', 'n':'ㄙ',
        '7':'˙', 'u':'ㄧ', 'j':'ㄨ', 'm':'ㄩ', '8':'ㄚ', 'i':'ㄛ', 'k':'ㄜ', ',':'ㄝ',
        '9':'ㄞ', 'o':'ㄟ', 'l':'ㄠ', '.':'ㄡ', '0':'ㄢ', 'p':'ㄣ', ';':'ㄤ', '/':'ㄥ',
        '-':'ㄦ', ' ':' ' 
    };

    // 產生反向對應表 (注音 -> 英文)
    const reverseZhuyinMap = {};
    for (let key in zhuyinMap) {
        reverseZhuyinMap[zhuyinMap[key]] = key;
    }

    // 2. 自訂迷你詞庫 (注音 -> 中文)
    const dictionary = {
        'ㄋㄧˇㄏㄠˇ': '你好', 'ㄨㄛˇㄞˋㄋㄧˇ': '我愛你', 'ㄒㄧㄝˋㄒㄧㄝˋ': '謝謝',
        'ㄉㄨㄟˋㄅㄨˋㄑㄧˇ': '對不起', 'ㄊㄞˊㄨㄢ': '台灣', 'ㄏㄠˇㄒㄧㄠˋ': '好笑',
        'ㄨㄛˇ': '我', 'ㄋㄧˇ': '你', 'ㄊㄚ': '他', 'ㄕˋ': '是', 'ㄉㄜ˙': '的', 
        'ㄌㄜ˙': '了', 'ㄅㄨˋ': '不', 'ㄏㄠˇ': '好', 'ㄧㄡˇ': '有', 'ㄇㄚ˙': '嗎'
    };

    // 產生反向詞庫 (中文 -> 注音)
    const reverseDictionary = {};
    for (let key in dictionary) {
        reverseDictionary[dictionary[key]] = key;
    }

    // 功能一：英文轉中文
    function toChinese() {
        const input = document.getElementById('inputEn').value.toLowerCase();
        let zhuyinStr = '';
        
        // 轉注音
        for (let char of input) {
            zhuyinStr += zhuyinMap[char] || char;
        }

        // 轉中文
        let chineseStr = zhuyinStr;
        const sortedKeys = Object.keys(dictionary).sort((a, b) => b.length - a.length);
        for (let key of sortedKeys) {
            chineseStr = chineseStr.split(key).join(dictionary[key]); // 替換全部
        }
        document.getElementById('outputZh').innerText = chineseStr || '...';
    }

    // 功能二：中文轉英文 (火星文)
    function toEnglish() {
        let input = document.getElementById('inputZh').value;
        
        // 步驟一：先將中文轉成注音 (查反向詞庫)
        let zhuyinStr = input;
        const sortedWords = Object.keys(reverseDictionary).sort((a, b) => b.length - a.length);
        for (let word of sortedWords) {
            zhuyinStr = zhuyinStr.split(word).join(reverseDictionary[word]);
        }

        // 步驟二：將注音轉成英文字母 (查反向鍵盤表)
        let englishStr = '';
        for (let char of zhuyinStr) {
            englishStr += reverseZhuyinMap[char] || char;
        }

        document.getElementById('outputEn').innerText = englishStr || '...';
    }
</script>

</body>
</html>
